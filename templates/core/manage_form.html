{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container" style="max-width:820px;margin-left:0">
  <a class="crumb" href="{{ back_url }}"><i class="bi bi-chevron-left"></i>{{ title }}</a>
  <div class="page-head"><div><h1>{% if editing %}Tahrirlash{% else %}Yangi yozuv{% endif %}</h1><p>{{ title }}</p></div></div>
  <div class="panel panel-pad"><form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate>{% csrf_token %}{% include "includes/form_grid.html" %}
    <div class="d-flex gap-2 mt-2"><button class="btn btn-brand" type="submit">Saqlash</button><a class="btn btn-outline-secondary" href="{{ back_url }}">Bekor qilish</a></div></form></div>
</div>
{% endblock %}
