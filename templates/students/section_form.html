{% extends "base.html" %}
{% block title %}{{ cfg.title }}{% endblock %}
{% block content %}
<div class="container" style="max-width:640px;margin-left:0">
  <a class="crumb" href="{% url 'students:profile' %}"><i class="bi bi-chevron-left"></i>Profil</a>
  <div class="page-head"><div><h1>{{ cfg.title }}{% if editing %}: tahrirlash{% else %}: qo'shish{% endif %}</h1></div></div>
  <div class="panel panel-pad">
    <form method="post" {% if cfg.multipart %}enctype="multipart/form-data"{% endif %} novalidate>{% csrf_token %}{% include "includes/form_fields.html" %}
      <div class="d-flex gap-2"><button class="btn btn-brand" type="submit">Saqlash</button><a class="btn btn-outline-secondary" href="{% url 'students:profile' %}">Bekor qilish</a></div>
    </form>
  </div>
</div>
{% endblock %}
