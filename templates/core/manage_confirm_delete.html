{% extends "base.html" %}
{% block title %}O'chirish{% endblock %}
{% block content %}
<div class="container" style="max-width:560px;margin-left:0">
  <div class="panel panel-pad">
    <h1 class="h4">«{{ obj }}» o'chirilsinmi?</h1>
    <p class="text-muted">{{ title }}. Bu amalni qaytarib bo'lmaydi.</p>
    {% if not allowed %}<div class="alert alert-warning">{{ message }}</div>{% endif %}
    <form method="post" class="d-flex gap-2">{% csrf_token %}
      {% if allowed %}<button class="btn btn-danger" type="submit">Ha, o'chirish</button>{% endif %}
      <a class="btn btn-outline-secondary" href="{{ back_url }}">Orqaga</a></form>
  </div>
</div>
{% endblock %}
